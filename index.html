<!DOCTYPE html>
<!-- html: define la raíz del documento HTML -->
<!-- lang: especifica el idioma del contenido (es = español) -->
<html lang="es">
<head>
    <!-- meta: define metadatos como el conjunto de caracteres o la configuración de pantalla -->
    <!-- charset: especifica la codificación de caracteres (UTF-8) -->
    <meta charset="UTF-8">
    <!-- title: define el título de la página que se muestra en la pestaña del navegador -->
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>

    <!-- form: crea un formulario interactivo para recoger datos del usuario -->
    <!-- action: indica la URL a la que se envían los datos del formulario -->
    <!-- method: define el método HTTP (get o post) para enviar los datos -->
    <!-- autocomplete: activa o desactiva el autocompletado del navegador -->
    <!-- novalidate: indica que el formulario no debe validarse al enviarse -->
    <form action="#" method="post" autocomplete="on" novalidate>

        <!-- p: define un párrafo de texto para organizar y estructurar el contenido en bloques -->
        <p>
            <!-- label: representa una etiqueta o texto explicativo para un elemento del formulario -->
            <!-- for: vincula la etiqueta con el id del input que está controlando -->
            <label for="nombre">Nombre:</label>
            <!-- input: crea un campo interactivo para que el usuario introduzca datos -->
            <!-- type: especifica el tipo de control o input que se va a mostrar -->
            <!-- id: identificador único global para el elemento en toda la página -->
            <!-- name: nombre del campo que se envía al servidor como clave del dato -->
            <!-- placeholder: texto provisional que muestra una pista dentro del campo vacío -->
            <!-- required: obliga al usuario a rellenar el campo antes de enviar -->
            <!-- minlength: define el número mínimo de caracteres permitidos -->
            <!-- maxlength: define el número máximo de caracteres permitidos -->
            <!-- size: define el ancho visual del campo en cantidad de caracteres -->
            <!-- pattern: expresión regular que el valor del campo debe cumplir de forma estricta -->
            <!-- autofocus: hace que el campo reciba el foco automáticamente al cargar la página -->
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required minlength="2" maxlength="20" size="15" pattern="[A-Za-z]+" autofocus>
        </p>

        <p>
            <label for="buscar">Buscar:</label>
            <!-- search: campo de texto optimizado técnicamente para realizar búsquedas -->
            <input type="search" id="buscar" name="buscar" placeholder="Buscar contenido...">
        </p>

        <p>
            <label for="clave">Contraseña:</label>
            <!-- password: campo de texto que oculta los caracteres introducidos por motivos de seguridad -->
            <input type="password" id="clave" name="clave">
        </p>

    </form>

</body>
</html>
