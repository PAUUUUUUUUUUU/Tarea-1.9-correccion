<!DOCTYPE html>
<!-- html: define la raíz del documento HTML -->
<!-- lang: especifica el idioma del contenido (es = español) -->
<html lang="es">
<head>
    <!-- meta: define metadatos como el conjunto de caracteres o la configuración de pantalla -->
    <!-- charset: especifica la codificación de caracteres (UTF-8) -->
    <meta charset="UTF-8">
    <!-- title: define el título de la página que se muestra en la pestaña del navegador -->
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>

    <!-- form: crea un formulario interactivo para recoger datos del usuario -->
    <!-- action: indica la URL a la que se envían los datos del formulario -->
    <!-- method: define el método HTTP (get o post) para enviar los datos -->
    <!-- autocomplete: activa o desactiva el autocompletado del navegador -->
    <!-- novalidate: indica que el formulario no debe validarse al enviarse -->
    <form action="#" method="post" autocomplete="on" novalidate>

        <!-- p: define un párrafo de texto para organizar y estructurar el contenido en bloques -->
        <p>
            <!-- label: representa una etiqueta o texto explicativo para un elemento del formulario -->
            <!-- for: vincula la etiqueta con el id del input que está controlando -->
            <label for="nombre">Nombre:</label>
            <!-- input: crea un campo interactivo para que el usuario introduzca datos -->
            <!-- type: especifica el tipo de control o input que se va a mostrar -->
            <!-- id: identificador único global para el elemento en toda la página -->
            <!-- name: nombre del campo que se envía al servidor como clave del dato -->
            <!-- placeholder: texto provisional que muestra una pista dentro del campo vacío -->
            <!-- required: obliga al usuario a rellenar el campo antes de enviar -->
            <!-- minlength: define el número mínimo de caracteres permitidos -->
            <!-- maxlength: define el número máximo de caracteres permitidos -->
            <!-- size: define el ancho visual del campo en cantidad de caracteres -->
            <!-- pattern: expresión regular que el valor del campo debe cumplir de forma estricta -->
            <!-- autofocus: hace que el campo reciba el foco automáticamente al cargar la página -->
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required minlength="2" maxlength="20" size="15" pattern="[A-Za-z]+" autofocus>
        </p>

        <p>
            <label for="buscar">Buscar:</label>
            <!-- search: campo de texto optimizado técnicamente para realizar búsquedas -->
            <input type="search" id="buscar" name="buscar" placeholder="Buscar contenido...">
        </p>

        <p>
            <label for="clave">Contraseña:</label>
            <!-- password: campo de texto que oculta los caracteres introducidos por motivos de seguridad -->
            <input type="password" id="clave" name="clave">
        </p>

        <p>
            <label for="correos">Correos:</label>
            <!-- email: campo de texto que obliga a introducir una dirección de correo válida -->
            <!-- multiple: permite al usuario seleccionar o introducir más de un valor (separados por comas) -->
            <input type="email" id="correos" name="correos" multiple>
        </p>

        <p>
            <label for="sitio_web">Web:</label>
            <!-- url: campo de texto que obliga a introducir una dirección web absoluta válida -->
            <input type="url" id="sitio_web" name="sitio_web">
        </p>

        <p>
            <label for="telefono">Teléfono:</label>
            <!-- tel: campo de texto optimizado para introducir números de teléfono -->
            <input type="tel" id="telefono" name="telefono">
        </p>

        <p>
            <!-- select: crea una lista desplegable de opciones seleccionables -->
            <!-- size: define el número de filas que se muestran visibles de manera simultánea -->
            <label for="pais">País:</label>
            <select id="pais" name="pais" size="1">
                <!-- option: define una opción individual dentro de una lista desplegable -->
                <!-- value: define el valor de datos que se enviará al servidor al procesar el formulario -->
                <!-- selected: hace que esta opción aparezca seleccionada por defecto al cargar -->
                <option value="es" selected>España</option>
                <option value="mx">México</option>
            </select>
        </p>

        <p>
            <span>Género:</span>
            <!-- radio: botón de opción donde solo se puede elegir uno de un grupo con el mismo name -->
            <!-- checked: marca un radio o checkbox como seleccionado por defecto de forma predeterminada -->
            <input type="radio" id="genero_m" name="genero" value="masculino" checked>
            <label for="genero_m">Masculino</label>
            <input type="radio" id="genero_f" name="genero" value="femenino">
            <label for="genero_f">Femenino</label>
        </p>

        <p>
            <span>Intereses:</span>
            <!-- checkbox: casilla de verificación que permite selecciones múltiples o independientes -->
            <input type="checkbox" id="int_web" name="intereses" value="web">
            <label for="int_web">Desarrollo Web</label>
        </p>

        <p>
            <label for="edad">Edad:</label>
            <!-- number: campo numérico que restringe la entrada de datos a solo números -->
            <!-- min: define el valor mínimo numérico o de fecha permitido en el control -->
            <!-- max: define el valor máximo numérico o de fecha permitido en el control -->
            <!-- step: especifica los saltos o incrementos de los valores en campos numéricos o de fecha -->
            <input type="number" id="edad" name="edad" min="18" max="99" step="1">
        </p>

        <p>
            <label for="volumen">Volumen:</label>
            <!-- range: control deslizante para seleccionar un valor numérico aproximado de un rango -->
            <input type="range" id="volumen" name="volumen" min="0" max="100">
        </p>

        <p>
            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <!-- date: selector de fecha completa que incluye año, mes y día de forma visual -->
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
        </p>

        <p>
            <label for="reunion">Cita:</label>
            <!-- datetime-local: selector de fecha y hora local juntas sin especificar zona horaria -->
            <input type="datetime-local" id="reunion" name="reunion">
        </p>

        <p>
            <label for="mes_vacaciones">Mes de vacaciones:</label>
            <!-- month: selector para escoger de forma específica un mes y un año concretos -->
            <input type="month" id="mes_vacaciones" name="mes_vacaciones">
        </p>

        <p>
            <label for="semana_reserva">Semana de Reserva:</label>
            <!-- week: selector para elegir una semana y un año específicos del calendario -->
            <input type="week" id="semana_reserva" name="semana_reserva">
        </p>

        <p>
            <label for="hora_evento">Hora del Evento:</label>
            <!-- time: selector para introducir una hora específica compuesta por horas y minutos -->
            <input type="time" id="hora_evento" name="hora_evento">
        </p>

        <p>
            <label for="archivo">Subir currículum:</label>
            <!-- file: botón que permite al usuario examinar y subir archivos desde su equipo local -->
            <!-- accept: especifica los tipos de archivos admitidos mediante extensiones o tipos MIME -->
            <input type="file" id="archivo" name="archivo" accept=".pdf">
        </p>

        <p>
            <label for="color_favorito">Color corporativo:</label>
            <!-- color: selector visual para elegir un color en formato hexadecimal (#RRGGBB) -->
            <input type="color" id="color_favorito" name="color_favorito">
        </p>

        <p>
            <label for="comentarios">Comentarios:</label>
            <!-- textarea: crea un control de texto multilínea para escribir bloques largos de texto -->
            <!-- rows: especifica el número de líneas o filas de texto visibles en el área -->
            <!-- cols: especifica el ancho visible del área en cantidad de caracteres promedio -->
            <textarea id="comentarios" name="comentarios" rows="4" cols="30"></textarea>
        </p>

        <p>
            <!-- hidden: campo invisible para el usuario que envía datos técnicos o de sesión al servidor -->
            <!-- value: define el valor de datos por defecto asignado internamente al control -->
            <input type="hidden" id="token" name="token" value="secret123">
        </p>

        <!-- button: crea un botón interactivo dentro del flujo del documento -->
        <!-- type="submit": tipo de botón que envía los datos del formulario al servidor -->
        <button type="submit">Enviar Registro</button>
        
        <!-- type="reset": tipo de botón que revierte todos los campos a su estado inicial -->
        <button type="reset">Limpiar Todo</button>
        
        <!-- type="button": botón estándar sin acciones por defecto para usar con scripts externos -->
        <button type="button">Acción JS</button>

        <p>
            <!-- image: botón gráfico que envía el formulario usando una imagen -->
            <!-- src: especifica la ruta de origen o URL del archivo de imagen a renderizar -->
            <!-- alt: define un texto alternativo accesible para describir la imagen -->
            <input type="image" src="https://placeholder.com" alt="Enviar">
        </p>

    </form>

    <p>
        <!-- a: crea un hiperenlace para navegar hacia otros recursos o páginas web -->
        <!-- href: especifica la URL o dirección a la que dirige el enlace al hacer clic -->
        <a href="https://es.wikipedia.org" target="_blank">Visitar Wikipedia</a>
    </p>

    <p>
        <!-- iframe: inserta un marco o documento HTML anidado dentro de la página actual -->
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12312.3!2d-0.3762881!3d39.4699075!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd604f4cf0efb06f%3A0x264d85152d1001a1!2sValencia!5e0!3m2!1ses!2ses!4v1234567890" 
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </p>

    <p>
        <a href="https://validator.w3.org" target="_blank">Validar código HTML en W3C</a>
    </p>

    <!-- Reflexión GET: Al enviar el formulario con el método GET, todos los parámetros introducidos por el usuario se añaden visibles en la barra de direcciones de la URL tras el símbolo '?'. La contraseña se muestra en texto plano, de los archivos solo se envía el nombre pero no su contenido, los campos desactivados no se envían y el botón de imagen adjunta las coordenadas del clic. -->

</body>
</html>
